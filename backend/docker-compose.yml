services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://tl:tl@db/tl
      JWT_SECRET: change-me
    ports: ["8000:8000"]
    depends_on: [db]
  db:
    image: postgres:16
    environment: {POSTGRES_USER: tl, POSTGRES_PASSWORD: tl, POSTGRES_DB: tl}
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata: {}
